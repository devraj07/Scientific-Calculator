<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Scientific Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <h1 class="title">Scientific Calculator</h1>

    <div class="calculator">
      <input type="text" id="display" class="display" placeholder="0" readonly />

      <div class="keys">
        <!-- Row 1 -->
        <button class="func" data-action="clear">C</button>
        <button class="func" data-action="backspace">DEL</button>
        <button class="func" data-value="(">(</button>
        <button class="func" data-value=")">)</button>
        <button class="func" data-value="π">π</button>

        <!-- Row 2 -->
        <button class="func" data-value="sin(">sin</button>
        <button class="func" data-value="cos(">cos</button>
        <button class="func" data-value="tan(">tan</button>
        <button class="func" data-value="log(">log</button>
        <button class="func" data-value="ln(">ln</button>

        <!-- Row 3 -->
        <button class="func" data-value="sqrt(">√</button>
        <button class="func" data-value="^">xʸ</button>
        <button class="op" data-value="/">÷</button>
        <button class="op" data-value="*">×</button>
        <button class="op" data-value="-">−</button>

        <!-- Row 4 -->
        <button data-value="7">7</button>
        <button data-value="8">8</button>
        <button data-value="9">9</button>
        <button class="op" data-value="+">+</button>
        <button data-value="4">4</button>

        <!-- Row 5 -->
        <button data-value="5">5</button>
        <button data-value="6">6</button>
        <button data-value="1">1</button>
        <button data-value="2">2</button>
        <button data-value="3">3</button>

        <!-- Row 6 -->
        <button class="wide" data-value="0">0</button>
        <button data-value=".">.</button>
        <button class="equal" data-action="calculate">=</button>
      </div>
    </div>

    <p class="note">
      Trigonometric functions use <strong>radians</strong>. Example: sin(3.14) ≈ 0.
    </p>
  </div>

  <script src="script.js"></script>
</body>
</html>
